<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>D8D Tech social preview source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body { font-family: Arial, Helvetica, sans-serif; color: #f6f8f5; background: #071522; }
    main { position: relative; overflow: hidden; width: 1200px; height: 630px; padding: 78px 92px; background: radial-gradient(circle at 84% 38%, #0b4b4a 0, #102e3c 26%, #071522 67%); }
    main::after { content: ""; position: absolute; width: 430px; height: 430px; right: -70px; top: 90px; border: 1px solid rgba(103, 214, 193, .18); border-radius: 50%; box-shadow: 0 0 0 48px rgba(103, 214, 193, .04), 0 0 0 96px rgba(103, 214, 193, .025); }
    .brand { position: relative; z-index: 1; width: 430px; height: auto; }
    .line { position: relative; z-index: 1; margin-top: 87px; max-width: 800px; font-family: Georgia, 'Times New Roman', serif; font-size: 54px; line-height: 1.14; letter-spacing: -1.4px; }
    .line span { color: #58cfb7; }
    .status { position: relative; z-index: 1; margin-top: 36px; color: #d2e4e0; font-size: 19px; letter-spacing: .02em; }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="../exports/d8d-tech-light-on-dark.svg" alt="D8D Tech">
    <div class="line">Pre-owned smartphones.<br><span>A new chapter in Ireland.</span></div>
    <p class="status">In preparation · Not currently accepting orders</p>
  </main>
</body>
</html>
