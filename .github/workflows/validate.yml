name: Validate website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test measurement configuration
        run: pnpm test

      - name: Build Pages artifact
        env:
          VITE_MEASUREMENT_ENABLED: ${{ vars.VITE_MEASUREMENT_ENABLED }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_CLARITY_ID: ${{ vars.VITE_CLARITY_ID }}
          VITE_PRIVACY_OPERATOR: ${{ vars.VITE_PRIVACY_OPERATOR }}
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
        run: pnpm build:pages
